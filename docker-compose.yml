services:
  api:
    build: .
    image: docmind:local
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL (your Neon connection string) in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.6-flash}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ui:
    image: docmind:local
    pull_policy: never
    command: streamlit run ui/DocMind.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    environment:
      DOCMIND_API_URL: http://api:8000
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  uploads: